<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWIC Weekly Review – Middlegame Plans</title>
<style>
:root{--fs:20px;--paper:#fbfaf7;--ink:#1d1f22;--muted:#5d6670;--line:#e2e0da;--card:#fff;--main:#1f4fa3;--mainbg:#1f4fa3;--mainfg:#fff;--btn:#fff;--btnb:#cfd5db;--tag-fight:#7b3f00;--tag-fight-bg:#fff3e6;--tag-upset:#5a0019;--tag-upset-bg:#ffeef2;--tag-mini:#1a4700;--tag-mini-bg:#edfbe8}
:root[data-theme="dark"]{--paper:#16191d;--ink:#e4e6e9;--muted:#9aa3ad;--line:#2c3238;--card:#1d2126;--main:#86b4ff;--mainbg:#2f5ea8;--mainfg:#fff;--btn:#232930;--btnb:#3a434c;--tag-fight:#ffb74d;--tag-fight-bg:#3a2500;--tag-upset:#ff8fab;--tag-upset-bg:#3a0015;--tag-mini:#81c784;--tag-mini-bg:#1a3300}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.5}
.top{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);font-family:system-ui,"Segoe UI",sans-serif;font-size:15px;flex-wrap:wrap}
.top input{flex:1;min-width:160px;max-width:360px;font:inherit;padding:7px 12px;border:1px solid var(--btnb);border-radius:8px;background:var(--btn);color:var(--ink)}
.filters{display:flex;gap:6px;align-items:center}
.fil{font:inherit;font-size:14px;background:var(--btn);color:var(--ink);border:1px solid var(--btnb);border-radius:16px;padding:5px 13px;cursor:pointer;transition:background .15s}
.fil.active,.fil:hover{background:var(--mainbg);color:var(--mainfg);border-color:var(--mainbg)}
.fil[data-f="Fighting"].active{background:var(--tag-fight-bg);color:var(--tag-fight);border-color:var(--tag-fight)}
.fil[data-f="Upset"].active{background:var(--tag-upset-bg);color:var(--tag-upset);border-color:var(--tag-upset)}
.fil[data-f="Miniature"].active{background:var(--tag-mini-bg);color:var(--tag-mini);border-color:var(--tag-mini)}
.top .sp{flex:1}
.ctrls{display:flex;gap:6px}
button{font:inherit;background:var(--btn);color:var(--ink);border:1px solid var(--btnb);border-radius:7px;padding:6px 12px;cursor:pointer;min-width:40px}
header.hero{max-width:1100px;margin:0 auto;padding:36px 16px 10px}
.kicker{font-family:system-ui,"Segoe UI",sans-serif;font-size:.7em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:system-ui,"Segoe UI",sans-serif;font-size:2.2em;line-height:1.1;margin:.15em 0 .2em}
.sub{color:var(--muted);margin:0;font-size:.9em}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px;display:grid;gap:18px}
.card{display:flex;gap:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.thumb img{width:190px;height:auto;display:block;border-radius:4px;border:1px solid var(--line)}
.info{min-width:0}
.meta{font-family:system-ui,"Segoe UI",sans-serif;font-size:.7em;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
h2{font-family:system-ui,"Segoe UI",sans-serif;font-size:1.3em;margin:.15em 0}
h2 a{color:var(--ink);text-decoration:none}h2 a:hover{color:var(--main)}
.theme{color:var(--main);font-family:system-ui,"Segoe UI",sans-serif;font-size:.85em;font-weight:600;margin:.1em 0}
.dek{color:var(--muted);font-size:.9em;margin:.3em 0 .5em}
.players{color:var(--muted);font-size:.8em;font-family:system-ui,"Segoe UI",sans-serif;margin:.2em 0 .6em}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:.4em 0 .8em}
.tag{font-family:system-ui,"Segoe UI",sans-serif;font-size:.72em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:12px;border:1px solid}
.tag-Fighting{background:var(--tag-fight-bg);color:var(--tag-fight);border-color:var(--tag-fight)}
.tag-Upset{background:var(--tag-upset-bg);color:var(--tag-upset);border-color:var(--tag-upset)}
.tag-Miniature{background:var(--tag-mini-bg);color:var(--tag-mini);border-color:var(--tag-mini)}
.btns{display:flex;gap:10px;flex-wrap:wrap;font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
.b{padding:8px 16px;border-radius:8px;border:1px solid var(--btnb);color:var(--ink);text-decoration:none;background:var(--btn)}
.b.main{background:var(--mainbg);color:var(--mainfg);border-color:var(--mainbg);font-weight:600}
.b.pgn{font-size:.85em;padding:6px 12px}
.count{font-family:system-ui,"Segoe UI",sans-serif;font-size:14px;color:var(--muted)}
.none{color:var(--muted);font-style:italic;padding:20px 0}
@media(max-width:680px){.card{flex-direction:column}.thumb img{width:100%;max-width:260px}.top{padding:8px 12px}.top input{min-width:120px}.top .sp{display:none}}
</style>
</head>
<body>
<div class="top">
  <input id="q" type="search" placeholder="Search issue, theme, players…" aria-label="Search">
  <a href="training.html" style="font-size:14px;font-weight:600;color:var(--main);text-decoration:none;white-space:nowrap;font-family:system-ui,'Segoe UI',sans-serif">🎯 Training</a>
  <div class="filters">
    <button class="fil" data-f="Miniature">Miniature</button>
    <button class="fil" data-f="Fighting">Fighting</button>
    <button class="fil" data-f="Upset">Upset</button>
  </div>
  <span class="sp"></span>
  <span class="count" id="count"></span>
  <div class="ctrls">
    <button id="fm" title="Smaller text">A−</button><button id="fp" title="Larger text">A+</button><button id="dk">Dark</button>
  </div>
</div>
<header class="hero">
  <div class="kicker">The Week In Chess · Middlegame Plans</div>
  <h1>TWIC Weekly Review</h1>
  <p class="sub">Each week: seven key games from TWIC, annotated around a single opening theme – with prose notes at the turning points, a live-board HTML for the monitor, and an EPUB for the Kobo.</p>
</header>
<main id="list"></main>

<script>
const ISSUES = [{"num":1,"twic":1667,"slug":"twic1667","title":"Nf3/b3/Bb2: Seven Key Games","dek":"How the world’s best players handle the Nf3/b3/Bb2 system – from isolated d5 targets to kingside storms.","theme":"Nf3/b3/Bb2 System","date":"2026-10-23","games":7,"players":"Mamedyarov, Alonso Rosell, Lobanov, Kistrup, Sjugirov, Buckels, Kuzubov","filekey":"nf3b3bb2","tags":["Fighting","Upset"]},{"num":2,"twic":1667,"slug":"twic1667_kan","title":"Kan Sicilian: Black’s View","dek":"Six practical games with 1.e4 c5 2.Nf3 a6 – the queenside expansion, the ...e5 centre, and when to break with ...d5.","theme":"Kan/O’Kelly Sicilian (B28)","date":"2026-10-23","games":6,"players":"Serradell Munoz, Tselmuun, Mistrekov, Hrybacz, Gopal Krishna, Afandi, Valiyeva, Khuduzade, Pineda, Santanna, Ahmed Mustafa, Sobek","filekey":"kan","tags":["Fighting","Upset"]}];

function fmtDate(d){ const [y,m]=d.split('-'); return new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'}); }

function renderCard(iss){
  const dir=`issues/${iss.slug}`;
  const fk=iss.filekey||'';
  const htmlFile=`${dir}/twic${iss.twic}_${fk}.html`;
  const epubFile=`${dir}/twic${iss.twic}_${fk}.epub`;
  const pgnFile=`${dir}/twic${iss.twic}_${fk}.pgn`;
  const thumbFile=`${dir}/thumb.png`;
  const tags=(iss.tags||[]).map(t=>`<span class="tag tag-${t}">${t}</span>`).join('');
  return `<article class="card">
  <a class="thumb" href="${htmlFile}"><img src="${thumbFile}" alt="Board thumbnail for TWIC ${iss.twic}" loading="lazy"/></a>
  <div class="info">
    <div class="meta">TWIC ${iss.twic} &middot; ${fmtDate(iss.date)} &middot; ${iss.games} games</div>
    <h2><a href="${htmlFile}">TWIC ${iss.twic}: ${iss.title}</a></h2>
    <div class="theme">${iss.theme}</div>
    <p class="dek">${iss.dek}</p>
    <p class="players">${iss.players}</p>
    ${tags?`<div class="tagrow">${tags}</div>`:''}
    <div class="btns">
      <a class="b main" href="${htmlFile}">Read online</a>
      <a class="b" href="${epubFile}" download>Download EPUB</a>
      <a class="b pgn" href="${pgnFile}" download>PGN</a>
    </div>
  </div>
</article>`;
}

let activeFilter='';
let searchQ='';

function filtered(){
  return ISSUES.filter(iss=>{
    const matchF=!activeFilter||(iss.tags||[]).includes(activeFilter);
    const matchQ=!searchQ||[iss.twic,iss.theme,iss.title,iss.players,iss.date].join(' ').toLowerCase().includes(searchQ);
    return matchF&&matchQ;
  });
}

function render(){
  const items=filtered();
  const main=document.getElementById('list');
  main.innerHTML=items.length?items.map(renderCard).join(''):'<p class="none">No issues match.</p>';
  document.getElementById('count').textContent=items.length+' issue'+(items.length===1?'':'s');
}

// Filter buttons
document.querySelectorAll('.fil').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const f=btn.dataset.f;
    activeFilter=activeFilter===f?'':f;
    document.querySelectorAll('.fil').forEach(b=>b.classList.toggle('active',b.dataset.f===activeFilter));
    render();
  });
});

// Search
document.getElementById('q').addEventListener('input',e=>{
  searchQ=e.target.value.trim().toLowerCase();
  render();
});

// Font size
let fs=20;try{fs=parseInt(localStorage.getItem('fs')||'20')||20;}catch(e){}
document.documentElement.style.setProperty('--fs',fs+'px');
document.getElementById('fm').onclick=()=>{fs=Math.max(14,fs-2);document.documentElement.style.setProperty('--fs',fs+'px');try{localStorage.setItem('fs',fs)}catch(e){}};
document.getElementById('fp').onclick=()=>{fs=Math.min(32,fs+2);document.documentElement.style.setProperty('--fs',fs+'px');try{localStorage.setItem('fs',fs)}catch(e){}};

// Dark mode
try{if(localStorage.getItem('dk')==='1')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
document.getElementById('dk').onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  try{localStorage.setItem('dk',dark?'0':'1')}catch(e){}
};

render();
</script>
</body>
</html>
